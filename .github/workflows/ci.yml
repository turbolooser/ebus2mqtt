name: ci

# Tests (Python + ebusd laedt und dekodiert die CSV) und Datenschutz-Scan, dann beide Images nach ghcr.io:
#   ghcr.io/turbolooser/ebus2mqtt/bridge:sha-<kurz>   ghcr.io/turbolooser/ebus2mqtt/ebusd:sha-<kurz>
# Kein latest: der Compose-Stack pinnt sha-<kurz>, ein Push deployt nichts.
# Datenschutz (tools/privacy-scan.sh, Secret PRIVACY_DENYLIST): Repo und jedes Image auf jedem PR und vor jedem
# Push; ein Fund bricht ab. Gepusht wird genau das gescannte Image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest==8.3.3 ruff==0.7.4
      - run: ruff check --line-length 120 ebus2mqtt tests tools
      - run: python -m pytest -v

  ebusd-csv:
    # Das echte ebusd-Image laedt die CSV und dekodiert Telegramme vom 23.11.2026 (ohne Bus: Inject)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/ebusd.Dockerfile -t ebusd-test .
      - run: |
          docker run --rm --entrypoint ebusd ebusd-test --checkconfig --configpath=/etc/ebusd/wtc25 \
            --log=all:info 2>&1 | tee check.log
          grep -q "successfully read file wtc25.csv" check.log
          ! grep -q "ERR" check.log
      - run: python3 tools/ebusd_inject_test.py ebusd-test

  datenschutz-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/privacy-scan.sh repo .
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  images:
    needs: [tests, ebusd-csv, datenschutz-repo]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        teil: [bridge, ebusd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/turbolooser/ebus2mqtt/${{ matrix.teil }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.teil }}.Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.teil }}
          cache-to: type=gha,mode=max,scope=${{ matrix.teil }}
      - name: Datenschutz-Scan des Images
        run: |
          basis=$(awk '/^FROM /{print $2; exit}' docker/${{ matrix.teil }}.Dockerfile)
          tools/privacy-scan.sh image "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" "$basis"
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gescanntes Image pushen
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do docker push -q "$tag"; done <<< "$TAGS"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
